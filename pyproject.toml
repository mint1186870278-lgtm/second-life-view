[project]
name = "second-life-spatial-agent"
version = "0.1.0"
description = "Hackathon backend for active-perception spatial reuse agents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "langgraph>=0.2",
  "python-multipart>=0.0.9",
  "ultralytics>=8.3",
  "oss2>=2.19",
  "pyOpenSSL>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
yolo = ["ultralytics>=8.3", "opencv-python>=4.8", "numpy>=1.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
