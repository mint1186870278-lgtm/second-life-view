[project]
name = "second-life-spatial-agent"
version = "0.1.0"
description = "Hackathon backend for active-perception spatial reuse agents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
