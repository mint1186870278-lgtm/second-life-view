const scenes=[
  {id:'s1',index:'场景 01',name:'屋顶花园',meta:'360° 场景 · 已接入',status:'received'},
  {id:'s2',index:'场景 02',name:'休息区',meta:'360° 场景 · 已接入',status:'received'},
  {id:'s3',index:'场景 03',name:'入口',meta:'360° 场景 · 已接入',status:'received'},
  {id:'s4',index:'场景 04',name:'办公区',meta:'360° 场景 · 已接入',status:'received'},
  {id:'s5',index:'场景 05',name:'后勤区',meta:'360° 场景 · 接收中',status:'receiving'}
];

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2200);
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  location.hash=id;
  window.scrollTo(0,0);
}
function renderScenes(){
  const grid=document.getElementById('sceneGrid');
  grid.innerHTML=scenes.map(SceneCard).join('');
  const received=scenes.filter(s=>s.status==='received').length;
  const receiving=scenes.filter(s=>s.status==='receiving').length;
  document.getElementById('sceneCount').textContent=`${received} 已接入${receiving?` · ${receiving} 接收中`:''}`;
  const summary=document.getElementById('ingestionSummary');
  if(summary) summary.textContent=`已接入 ${received} 个场景${receiving?`，${receiving} 个接收中`:''}`;
  const next=document.getElementById('nextProcessing');
  if(next) next.disabled=received===0;
  bindRename();
}
function bindRename(){
  document.querySelectorAll('.scene-name').forEach(el=>{
    el.onclick=()=>{
      const card=el.closest('.scene-card');
      const id=card.dataset.sceneId;
      const scene=scenes.find(s=>s.id===id);
      if(!scene) return;
      const current=scene.name;
      el.innerHTML=`<input class="scene-name-input" maxlength="40" value="${current.replace(/"/g,'&quot;')}" aria-label="编辑场景名称" />`;
      const input=el.querySelector('input');
      input.focus(); input.select();
      const commit=()=>{
        const v=input.value.trim();
        scene.name=v||current;
        renderScenes();
      };
      input.onkeydown=e=>{
        if(e.key==='Enter') commit();
        if(e.key==='Escape') renderScenes();
      };
      input.onblur=commit;
      input.onclick=e=>e.stopPropagation();
    };
  });
}

let ingestionDemoStarted=false;
function maybeStartIngestionDemo(){
  if(ingestionDemoStarted) return;
  ingestionDemoStarted=true;
  const receiving=scenes.find(s=>s.status==='receiving');
  if(!receiving) return;
  setTimeout(()=>{
    receiving.status='received';
    receiving.meta='360° 场景 · 已接入';
    renderScenes();
    toast(`${receiving.index} · ${receiving.name} 已接入`);
  },1200);
}
const projectName=document.getElementById('projectName');
const nameError=document.getElementById('nameError');
const goUpload=document.getElementById('goUpload');
const desc=document.getElementById('projectDesc');
function validateName(showError=false){
  const ok=projectName.value.trim().length>0;
  goUpload.disabled=!ok;
  projectName.classList.toggle('invalid',showError&&!ok);
  nameError.textContent=(showError&&!ok)?'请填写项目名称':'';
  return ok;
}
document.getElementById('nameCount').textContent=projectName.value.length;
document.getElementById('descCount').textContent=desc.value.length;
projectName.oninput=e=>{
  document.getElementById('nameCount').textContent=e.target.value.length;
  validateName(false);
};
desc.oninput=e=>document.getElementById('descCount').textContent=e.target.value.length;
goUpload.onclick=()=>{
  if(!validateName(true)) return;
  show('c02');
  maybeStartIngestionDemo();
};
document.getElementById('cancelSetup').onclick=()=>{
  projectName.value='HSBC MKK';
  desc.value='对 HSBC MKK 现有构件进行 360° 审计，识别可能被复用、可再生或可再生的构件，评估其二次生命的可能路径，为后续改造与资源循环提供依据。';
  document.getElementById('nameCount').textContent=projectName.value.length;
  document.getElementById('descCount').textContent=desc.value.length;
  validateName(false);
  toast('已恢复本次 Demo 的默认项目内容');
};
document.getElementById('backSetup').onclick=()=>show('c01');

['exitCreate-1','exitCreate-2','exitCreate-3'].forEach(id=>{
  document.getElementById(id).onclick=()=>toast('黑客松原型：退出创建不在主演示链路');
});



function renderC03(){
  const readyScenes=scenes.filter(s=>s.status==='received');
  document.getElementById('c03SceneCount').textContent=`${readyScenes.length} 个场景`;
  document.getElementById('preprocessCopy').textContent=`${readyScenes.length} 个已接入场景已完成预处理，包括图像增强、格式标准化与空间信息提取。`;
  document.getElementById('processedCount').textContent=`${readyScenes.length} / ${readyScenes.length}`;
  document.getElementById('processedScenes').innerHTML=readyScenes.slice(0,5).map(ProcessedScene).join('');
}
document.getElementById('nextProcessing').onclick=()=>{
  const ready=scenes.filter(s=>s.status==='received').length;
  if(!ready){toast('请先等待至少一个场景接入完成');return;}
  renderC03();
  show('c03');
};
document.getElementById('backUpload').onclick=()=>show('c02');
document.getElementById('enterWorkspace').onclick=()=>{
  w01Zoom=W01_ZOOM_MIN;
  show('w01');
  renderW01Scene();
  applyW01Zoom();
};


bindD01();
bindW02();

renderScenes();
validateName(false);

// Interactive hackathon demo dropdowns.
// These values are intentionally fixture options, not a frozen production enum.
document.querySelectorAll('.demo-select').forEach(select=>{
  const btn=select.querySelector('.demo-select-button');
  const menu=select.querySelector('.demo-select-menu');
  const valueEl=select.querySelector('.demo-select-value');
  btn.onclick=(e)=>{
    e.stopPropagation();
    document.querySelectorAll('.demo-select.open').forEach(s=>{ if(s!==select){s.classList.remove('open');s.querySelector('.demo-select-button').setAttribute('aria-expanded','false');}});
    const willOpen=!select.classList.contains('open');
    select.classList.toggle('open',willOpen);
    btn.setAttribute('aria-expanded',String(willOpen));
  };
  menu.querySelectorAll('.demo-select-option').forEach(opt=>{
    opt.onclick=(e)=>{
      e.stopPropagation();
      valueEl.textContent=opt.dataset.value;
      menu.querySelectorAll('.demo-select-option').forEach(o=>{
        o.classList.toggle('active',o===opt);
        const c=o.querySelector('.checkmark'); if(c) c.remove();
        if(o===opt){const c=document.createElement('span');c.className='checkmark';c.textContent='✓';o.appendChild(c);}
      });
      select.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
    };
  });
});
document.addEventListener('click',()=>{
  document.querySelectorAll('.demo-select.open').forEach(s=>{
    s.classList.remove('open');
    s.querySelector('.demo-select-button').setAttribute('aria-expanded','false');
  });
});

bindW01();
renderW01Scene();

if(location.hash==='#c02'){show('c02');maybeStartIngestionDemo();}
if(location.hash==='#c03'){renderC03();show('c03');}
if(location.hash==='#w01'){w01Zoom=W01_ZOOM_MIN;show('w01');renderW01Scene();applyW01Zoom();}
if(location.hash==='#d01'){openD01();}
if(location.hash==='#w02'){showW02();}
</script>
