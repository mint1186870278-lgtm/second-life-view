<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Second Life View｜W02 Dual-view Project Review Prototype v2.4</title>
  <style>
:root{
  --canvas:#f7f8fa;
  --surface:#ffffff;
  --surface-soft:#f5f6f8;
  --border:#e4e8ed;
  --border-strong:#d5dbe3;
  --text:#111418;
  --text-2:#667085;
  --text-3:#8792a2;
  --dark:#17191d;
  --accent:#ffd400;
  --success:#18b66f;
  --success-bg:#e7f8ef;
  --warning:#c69300;
  --warning-bg:#fff4c8;
  --danger:#d92d20;
  --danger-bg:#fff0ee;
  --radius-card:14px;
  --radius-control:9px;
  --header-h:92px;
  --frame-w:1586px;
  --frame-h:992px;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#eef1f5;
  color:var(--text);
  font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.prototype-shell{
  width:min(var(--frame-w),100vw);
  min-height:var(--frame-h);
  margin:0 auto;
  background:var(--canvas);
  overflow:hidden;
}
.topbar{
  height:var(--header-h);
  display:grid;
  grid-template-columns:430px 1fr 320px;
  align-items:center;
  padding:0 38px;
  background:#fbfcfd;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:17px}
.logo-mark{width:39px;height:39px;flex:none}
.brand-title{font-size:22px;font-weight:760;letter-spacing:-.2px;line-height:1.2}
.brand-sub{margin-top:5px;color:#7c889a;font-size:14px}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px}
.step{display:flex;align-items:center;gap:10px;color:#657184;font-weight:650;font-size:16px;white-space:nowrap}
.step-dot{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  background:#edf0f3;color:#222;font-weight:800;
  border:1px solid transparent;
}
.step.active{color:#20242a}
.step.active .step-dot{background:#111;color:#fff;border:3px solid var(--accent)}
.step-line{width:26px;height:1px;background:#dfe4ea}
.top-actions{display:flex;justify-content:flex-end;align-items:center;gap:28px}
.ghost-btn{
  min-width:160px;height:52px;border-radius:9px;border:1px solid var(--border-strong);
  background:#fff;color:#1f242c;font-weight:650;font-size:17px;
}
.ghost-btn:hover{background:#fafbfc}
.avatar{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(145deg,#d3dbe4,#8797aa);
  position:relative;overflow:hidden;border:3px solid #eef1f4;
}
.avatar:before{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#3c4858;left:15px;top:8px}
.avatar:after{content:"";position:absolute;width:28px;height:20px;border-radius:16px 16px 6px 6px;background:#5d7084;left:8px;top:24px}

.page-wrap{padding:26px 38px 38px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 455px;gap:18px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.main-panel{padding:38px 40px 30px;min-height:806px}
.side-stack{display:flex;flex-direction:column;gap:16px}
.side-panel{padding:28px 30px}
.page-title{font-size:40px;font-weight:800;letter-spacing:-1.15px;line-height:1.15;margin:0 0 10px}
.page-desc{font-size:18px;line-height:1.6;color:#718097;margin:0 0 30px}

.form-row{display:grid;grid-template-columns:170px 1fr;align-items:start;gap:20px;margin-bottom:22px}
.form-label{font-size:18px;font-weight:700;padding-top:16px}
.required{color:#e83232;margin-left:5px}
.control-wrap{position:relative}
.control,.static-select,.textarea{
  width:100%;border:1px solid #dbe1e8;border-radius:var(--radius-control);
  background:#fff;color:#252b34;font-size:20px;
}
.control,.static-select{height:57px;padding:0 18px}
.control:focus,.textarea:focus{outline:2px solid rgba(255,212,0,.24);border-color:#cbd3dd}
.control.invalid{border-color:#ef847b;box-shadow:0 0 0 3px rgba(217,45,32,.08)}
.static-select{display:flex;align-items:center;justify-content:space-between;cursor:default}
.select-main{display:flex;align-items:center;gap:16px}
.inline-icon{width:27px;height:27px;stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chev{width:16px;height:16px;border-right:2px solid #667085;border-bottom:2px solid #667085;transform:rotate(45deg);margin-right:6px;margin-top:-5px}
.char-count{text-align:right;color:#667085;font-size:15px;margin-top:7px;padding-right:8px}
.field-error{font-size:14px;color:var(--danger);margin-top:7px;min-height:18px}
.textarea{height:170px;padding:14px 18px;resize:none;line-height:1.55;color:#667085}
.form-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:24px}
.secondary-btn,.primary-btn{
  height:57px;border-radius:9px;padding:0 32px;font-size:18px;font-weight:650;
}
.secondary-btn{border:1px solid #cfd6df;background:#fff;color:#222}
.primary-btn{border:1px solid var(--dark);background:var(--dark);color:#fff;min-width:250px}
.primary-btn:disabled{background:#d0d5dd;border-color:#d0d5dd;color:#f7f8fa}
.primary-btn .arrow{margin-left:14px}

.side-title{font-size:27px;font-weight:800;margin:0 0 24px}
.tip-item{display:grid;grid-template-columns:58px 1fr;gap:16px;margin:0 0 25px}
.tip-item:last-child{margin-bottom:0}
.icon-disc{width:58px;height:58px;border-radius:50%;background:#f0f2f4;display:grid;place-items:center}
.icon-disc.yellow{background:#fff0bb}
.tip-title{font-size:18px;font-weight:750;margin:2px 0 4px}
.tip-copy{font-size:16px;color:#68768b;line-height:1.55;margin:0}
.mini-tip{display:grid;grid-template-columns:58px 1fr;gap:16px;align-items:start}

/* Upload page */
.upload-main{padding:30px 34px 28px;min-height:806px}
.upload-title{font-size:40px;font-weight:800;letter-spacing:-1px;margin:0 0 6px}
.upload-zone{
  height:300px;border:2px dashed #ccd5e0;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-top:24px;background:#fff;transition:.18s;
}
.upload-zone.interactive{cursor:pointer}
.upload-zone.interactive:hover,.upload-zone.dragover{
  border-color:#aeb8c6;background:#fbfcfd;
}
.upload-zone.dragover{box-shadow:inset 0 0 0 3px rgba(255,212,0,.13)}
.upload-icon{width:84px;height:84px;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;margin-bottom:18px}
.upload-hero{font-size:21px;font-weight:750;margin-bottom:10px}
.upload-sub{font-size:17px;color:#718097;line-height:1.75;text-align:center}
.upload-divider{height:1px;background:#e7ebef;margin:24px 0 17px}
.section-row{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:22px;font-weight:800}
.section-meta{font-size:16px;color:#8490a1}
.ready-inline{color:#6e7b8e}
.ready-inline strong{color:var(--success);font-weight:700}
.scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scene-card{
  min-height:112px;border:1px solid #dfe4ea;border-radius:10px;background:#fff;
  padding:12px;display:grid;grid-template-columns:126px 1fr;gap:14px;align-items:center;
}
.scene-preview{
  height:86px;border-radius:7px;background:
    linear-gradient(135deg,#d9dee5 0%,#eef1f4 48%,#c5cdd7 49%,#dde2e8 100%);
  position:relative;overflow:hidden;border:1px solid #e1e5ea;
}
.scene-preview:before{
  content:"360";position:absolute;right:8px;bottom:7px;font-size:11px;font-weight:800;color:#536172;
  background:rgba(255,255,255,.84);padding:4px 6px;border-radius:5px;
}
.scene-main{min-width:0}
.scene-name,.scene-name-input{
  font-size:18px;font-weight:750;margin-bottom:8px;color:#161a20;
}
.scene-name{cursor:text;display:inline-block;border-bottom:1px dashed transparent}
.scene-name:hover{border-bottom-color:#9aa5b5}
.scene-name-input{
  width:100%;border:1px solid #cfd6df;border-radius:6px;padding:5px 7px;outline:none;margin-top:-2px
}
.status-line{display:flex;align-items:center;gap:8px}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 10px;
  background:var(--success-bg);color:var(--success);font-size:14px;font-weight:700;
}
.status-pill.uploading{background:#eef4ff;color:#3b82f6}
.status-pill.error{background:var(--danger-bg);color:var(--danger)}
.status-dot{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;position:relative}
.status-pill.ready .status-dot:after{
  content:"";position:absolute;width:5px;height:3px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(-45deg);left:3px;top:3px;
}
.status-pill.uploading .status-dot{border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.file-meta{font-size:14px;color:#8290a3;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upload-actions{display:flex;justify-content:space-between;margin-top:24px}
.right-advice .tip-item{margin-bottom:24px}
.right-advice .tip-copy{font-size:15px}

.screen{display:none}
.screen.active{display:block}
.hidden-input{display:none}
.toast{
  position:fixed;right:24px;bottom:24px;background:#181b20;color:#fff;border-radius:10px;
  padding:12px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.14);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s;z-index:20;
}
.toast.show{opacity:1;transform:translateY(0)}
.demo-note{
  margin-top:10px;font-size:13px;color:#98a2b3;line-height:1.5;
}
@media (max-width:1200px){
  .topbar{grid-template-columns:330px 1fr 230px;padding:0 22px}
  .page-wrap{padding:22px}
  .two-col{grid-template-columns:minmax(0,1fr) 390px}
}


/* Hackathon demo dropdowns: interactive fixture options, not production enums */
.demo-select{position:relative}
.demo-select-button{
  width:100%;height:57px;padding:0 18px;
  border:1px solid #dbe1e8;border-radius:var(--radius-control);
  background:#fff;color:#252b34;font-size:20px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;
}
.demo-select-button:hover{border-color:#cbd3dd}
.demo-select.open .demo-select-button{
  outline:2px solid rgba(255,212,0,.22);
  border-color:#cbd3dd;
}
.demo-select-menu{
  position:absolute;left:0;right:0;top:63px;z-index:40;
  background:#fff;border:1px solid #dbe1e8;border-radius:10px;
  box-shadow:0 12px 32px rgba(16,24,40,.12);
  padding:6px;display:none;
}
.demo-select.open .demo-select-menu{display:block}
.demo-select-option{
  min-height:46px;padding:0 12px;border-radius:7px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;font-size:17px;color:#252b34;
  cursor:pointer;
}
.demo-select-option:hover{background:#f6f7f9}
.demo-select-option.active{background:#f3f4f6;font-weight:700}
.demo-select-note{
  margin-top:7px;font-size:12px;color:#98a2b3;
}
.checkmark{font-size:15px;color:#111}


/* C03 Processing complete */
.processing-main{padding:28px 30px 22px;min-height:806px}
.processing-title{font-size:40px;font-weight:800;letter-spacing:-1px;margin:0 0 6px}
.processing-hero{
  border:1px solid #dfe4ea;border-radius:10px;background:#fff;
  min-height:118px;padding:20px 28px;margin-top:16px;
  display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center;
}
.progress-ring{
  width:92px;height:92px;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--success) 0 100%, #e9edf1 100% 100%);
  position:relative;
}
.progress-ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
.progress-ring strong{position:relative;font-size:22px;z-index:1}
.processing-hero-title{font-size:22px;font-weight:800;margin-bottom:7px}
.processing-hero-meta{font-size:16px;color:#718097;margin-bottom:6px}
.processing-hero-copy{font-size:16px;color:#667085}
.stage-stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.stage-row{
  min-height:70px;border:1px solid #dfe4ea;border-radius:9px;background:#fff;
  display:grid;grid-template-columns:230px 1px 1fr 28px;align-items:center;
  padding:0 20px;gap:18px;
}
.stage-name{display:flex;align-items:center;gap:16px;font-size:19px;font-weight:750}
.stage-divider{height:42px;background:#e6eaef}
.stage-status{font-size:15px;color:#657184;line-height:1.45}
.stage-status strong{display:inline-flex;align-items:center;gap:7px;color:var(--success);font-size:16px;margin-bottom:3px}
.done-dot{width:18px;height:18px;border-radius:50%;background:var(--success);position:relative;display:inline-block;flex:none}
.done-dot:after{
  content:"";position:absolute;width:6px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg);left:5px;top:5px;
}
.stage-arrow{font-size:28px;color:#536173;text-align:center}
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
.metric-card{
  min-height:77px;border:1px solid #dfe4ea;border-radius:9px;background:#fff;
  padding:12px 18px;display:flex;align-items:center;gap:14px;
}
.metric-icon{width:48px;height:48px;border-radius:50%;background:#f2f4f6;display:grid;place-items:center;flex:none}
.metric-icon.warn{background:#fff0bb}
.metric-label{font-size:15px;color:#738095;margin-bottom:2px}
.metric-value{font-size:29px;font-weight:800;line-height:1}
.metric-unit{font-size:14px;color:#738095;margin-left:5px;font-weight:500}
.processed-header{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.processed-header .section-title{font-size:19px}
.processed-count{font-size:15px;color:#738095}
.processed-scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.processed-scene{border:1px solid #dfe4ea;border-radius:9px;background:#fff;padding:7px;min-width:0}
.processed-thumb{
  height:76px;border-radius:6px;
  background:linear-gradient(145deg,#d8dee5,#eef1f4 50%,#c3ccd5 51%,#dee3e8);
  position:relative;border:1px solid #e1e5ea;
}
.processed-thumb:after{
  content:"媒体占位";position:absolute;right:7px;bottom:6px;font-size:10px;color:#647184;
  background:rgba(255,255,255,.86);padding:3px 5px;border-radius:4px;
}
.processed-name{font-size:15px;font-weight:750;margin:7px 3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.processed-status{font-size:13px;color:var(--success);font-weight:700;margin:0 3px}
.processing-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.enter-btn{min-width:190px}
.result-list .tip-item{margin-bottom:24px}
.result-list .tip-copy{font-size:15px}


/* v0.7 — C02 Material Ingestion */
.ingestion-panel{
  height:300px;
  border:1px solid #dfe4ea;
  border-radius:12px;
  margin-top:24px;
  background:#fff;
  display:grid;
  grid-template-columns:138px 1fr;
  align-items:center;
  gap:28px;
  padding:34px 44px;
}
.ingestion-visual{
  width:112px;height:112px;border-radius:50%;
  background:#f1f3f5;
  display:grid;place-items:center;
  position:relative;
}
.ingestion-visual .inline-icon{width:48px;height:48px}
.ingestion-pulse{
  position:absolute;
  width:20px;height:20px;border-radius:50%;
  right:7px;bottom:12px;
  background:var(--success);
  border:4px solid #fff;
  box-shadow:0 0 0 0 rgba(24,182,111,.3);
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(24,182,111,.35)}
  70%{box-shadow:0 0 0 12px rgba(24,182,111,0)}
  100%{box-shadow:0 0 0 0 rgba(24,182,111,0)}
}
.ingestion-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--success);font-size:15px;font-weight:750;
  margin-bottom:9px;
}
.ingestion-title{font-size:26px;font-weight:800;margin-bottom:8px}
.ingestion-copy{font-size:17px;line-height:1.65;color:#718097;max-width:600px}
.ingestion-meta{
  display:flex;align-items:center;gap:18px;
  margin-top:18px;color:#667085;font-size:15px;
}
.ingestion-meta strong{color:#1d242c}
.ingestion-sep{width:1px;height:18px;background:#dfe4ea}

.scene-card.ingestion{grid-template-columns:126px 1fr}
.status-pill.waiting{background:#f1f3f5;color:#667085}
.status-pill.receiving{background:#eef4ff;color:#3b82f6}
.status-pill.receiving .status-dot{border-top-color:transparent;animation:spin .8s linear infinite}
.status-pill.received{background:var(--success-bg);color:var(--success)}
.status-pill.received .status-dot:after{
  content:"";position:absolute;width:5px;height:3px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(-45deg);left:3px;top:3px;
}
.status-pill.ingestion_error{background:var(--danger-bg);color:var(--danger)}
.ingestion-note{margin-top:12px;font-size:13px;color:#98a2b3;line-height:1.5}
.provisional-action-note{font-size:12px;color:#98a2b3;margin-top:8px;text-align:right;max-width:330px}


/* ============================================================
   v0.9 W01 Pixel-Locked Rebuild
   Screenshot is reference only; all UI below is real DOM/CSS.
   ============================================================ */

.processed-scenes{grid-template-columns:repeat(5,1fr)}

.w01-shell{
  width:1586px;
  height:992px;
  margin:0 auto;
  background:#fff;
  overflow:hidden;
  box-shadow:0 22px 80px rgba(16,24,40,.10);
  color:#111214;
}
.w01-header{
  height:78px;
  border-bottom:1px solid #e6e8eb;
  background:#fff;
  display:grid;
  grid-template-columns:450px 1fr 520px;
  align-items:center;
  gap:20px;
  padding:0 24px 0 30px;
}
.w01-header .brand{gap:14px}
.w01-header .logo-mark{width:42px;height:42px}
.w01-header .brand-title{font-size:22px;letter-spacing:-.3px}
.w01-header .brand-sub{font-size:12px;margin-top:4px}

.w01-view-toggle{
  justify-self:center;
  width:324px;height:48px;
  display:grid;grid-template-columns:1fr 1fr;
  background:#f1f2f4;border-radius:10px;padding:3px;
}
.w01-view-toggle button{
  border:0;background:transparent;border-radius:8px;
  font-size:17px;font-weight:800;color:#303741;cursor:pointer;
}
.w01-view-toggle button.active{
  background:#17191c;color:#ffd400;
  box-shadow:0 3px 10px rgba(16,24,40,.14);
}

.w01-header-right{
  display:flex;justify-content:flex-end;align-items:center;gap:14px;
}
.w01-context{position:relative}
.w01-context-btn{
  width:228px;height:58px;
  background:#fff;border:1px solid #dfe4ea;border-radius:10px;
  padding:8px 14px;
  display:grid;grid-template-columns:1fr 18px;align-items:center;
  cursor:pointer;text-align:left;
}
.w01-context-title{
  font-size:15px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.w01-context-meta{
  display:flex;gap:6px;align-items:center;
  margin-top:4px;font-size:12px;color:#667085
}
.w01-context-meta .inline-icon{width:15px;height:15px}
.w01-context-menu{
  display:none;position:absolute;right:0;top:64px;z-index:70;
  width:250px;background:#fff;border:1px solid #dfe4ea;border-radius:10px;
  padding:6px;box-shadow:0 14px 34px rgba(16,24,40,.14)
}
.w01-context.open .w01-context-menu{display:block}
.w01-context-item{
  width:100%;border:0;background:transparent;border-radius:7px;
  min-height:45px;padding:0 10px;text-align:left;
  font-size:14px;cursor:pointer
}
.w01-context-item:hover{background:#f5f6f8}
.w01-avatar{
  width:48px;height:48px;border-radius:50%;border:1px solid #dfe4ea;
  background:linear-gradient(145deg,#d8e3e9,#f2f4f6);
  position:relative;flex:none
}
.w01-avatar:before{
  content:"";position:absolute;width:15px;height:15px;border-radius:50%;
  background:#82909d;top:9px;left:16px
}
.w01-avatar:after{
  content:"";position:absolute;width:28px;height:17px;border-radius:16px 16px 10px 10px;
  background:#82909d;bottom:7px;left:9px
}
.w01-review-btn{
  height:58px;padding:0 24px;border:0;border-radius:10px;
  background:#17191c;color:#fff;font-size:16px;font-weight:800;
  display:flex;align-items:center;gap:20px;cursor:pointer;white-space:nowrap
}

.w01-body{
  height:914px;
  display:grid;
  grid-template-columns:228px minmax(0,1fr);
}
.w01-sidebar{
  border-right:1px solid #e6e8eb;background:#fff;
  padding:18px 14px 18px;
  overflow:hidden;
}
.w01-nav{display:flex;flex-direction:column;gap:6px}
.w01-nav-item{
  width:100%;height:52px;border:0;border-radius:9px;
  display:flex;align-items:center;gap:13px;padding:0 17px;
  background:transparent;color:#667085;font-size:16px;font-weight:800;
  cursor:pointer;text-align:left;position:relative
}
.w01-nav-item.active{
  color:#111214;background:#fff5c7
}
.w01-nav-item.active:before{
  content:"";position:absolute;left:-14px;top:0;bottom:0;width:7px;
  background:#ffd400;border-radius:0 5px 5px 0
}
.w01-nav-item .inline-icon{width:22px;height:22px}
.w01-side-divider{height:1px;background:#eceff2;margin:28px 0 22px}

.w01-stat-kicker{
  font-size:14px;font-weight:800;color:#667085;margin:0 14px 11px
}
.w01-stat-big{
  display:flex;align-items:flex-end;gap:10px;margin:0 14px 15px
}
.w01-stat-number{
  font-size:52px;line-height:.95;font-weight:850;letter-spacing:-2px
}
.w01-stat-unit{font-size:15px;color:#667085;margin-bottom:6px}
.w01-status-list{display:flex;flex-direction:column;gap:11px;padding:0 14px}
.w01-status-row{
  display:grid;grid-template-columns:18px 1fr auto;align-items:center;
  gap:9px;font-size:14px;font-weight:800;color:#424b58
}
.w01-status-dot{width:12px;height:12px;border-radius:50%}
.w01-status-dot.green{background:#62dd7d}
.w01-status-dot.blue{background:#168cf3}
.w01-status-dot.yellow{background:#ffc400}
.w01-status-dot.gray{background:#b7bfca}
.w01-status-value{font-weight:750;color:#596575}

.w01-group-title{
  font-size:14px;font-weight:800;color:#667085;
  margin:22px 14px 10px
}
.w01-group-list{display:flex;flex-direction:column;gap:5px;padding:0 5px}
.w01-group-row{
  min-height:36px;border:0;background:transparent;border-radius:7px;
  display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;
  padding:3px 9px;cursor:default;text-align:left
}
.w01-group-row:hover{background:#f7f8fa}
.w01-group-thumb{
  width:26px;height:26px;border-radius:5px;border:1px solid rgba(17,18,20,.08);
  overflow:hidden
}
.w01-group-thumb.wood{background:linear-gradient(135deg,#9b744d,#d2ae7a)}
.w01-group-thumb.planter{background:linear-gradient(135deg,#5b6b3d,#96a56f)}
.w01-group-thumb.deck{background:linear-gradient(135deg,#b58a62,#e0c39f)}
.w01-group-thumb.metal{background:linear-gradient(135deg,#98a1a7,#cbd1d5)}
.w01-group-thumb.rail{background:linear-gradient(135deg,#34383b,#70777c)}
.w01-group-thumb.grass{background:linear-gradient(135deg,#35581f,#72964d)}
.w01-group-name{font-size:14px;font-weight:750;color:#3f4854}
.w01-group-qty{font-size:12px;font-weight:800;color:#7d8794}

.w01-main{
  min-width:0;
  background:#f7f7f7;
  padding:0 16px 14px;
  display:grid;
  grid-template-rows:minmax(0,1fr) 142px;
  gap:12px
}
.w01-viewer{
  min-height:0;position:relative;overflow:hidden;
  border-radius:0 0 10px 10px;
  border:1px solid #dde3e8;border-top:0;
  background:
    radial-gradient(circle at 30% 18%,rgba(255,255,255,.72),transparent 17%),
    linear-gradient(180deg,#8ec5ff 0%,#c5e1f0 42%,#688676 43%,#8b8f78 62%,#806a54 100%)
}
.w01-viewer:before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:47%;
  background:
    linear-gradient(160deg,rgba(39,49,44,.0) 0 24%,rgba(58,68,60,.23) 24% 25%,transparent 25% 100%),
    repeating-linear-gradient(10deg,rgba(255,255,255,.06) 0 12px,rgba(22,28,25,.055) 12px 24px)
}
.w01-viewer:after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:21%;
  background:linear-gradient(90deg,rgba(64,50,34,.35),transparent);
  pointer-events:none
}

.w01-controls{
  position:absolute;top:26px;right:254px;z-index:20;
  display:flex;flex-direction:column;gap:8px
}
.w01-control{
  width:49px;height:49px;border:1px solid rgba(255,255,255,.28);
  border-radius:9px;background:rgba(24,27,29,.74);color:#fff;
  display:grid;place-items:center;cursor:pointer;font-size:24px;
  backdrop-filter:blur(8px)
}
.w01-control .inline-icon{width:22px;height:22px}
.w01-compass{
  height:58px;position:relative;font-size:15px;padding-top:10px
}
.w01-compass:before{
  content:"▲";position:absolute;top:5px;color:#ffd400;font-size:10px
}
.w01-compass span{margin-top:8px}

.w01-hotspot{
  position:absolute;z-index:12;display:flex;align-items:center;gap:8px;
  transform:translate(-12px,-50%);cursor:pointer;border:0;background:transparent;padding:0
}
.w01-hotspot-dot{
  width:31px;height:31px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.28);flex:none
}
.w01-hotspot-dot.yellow{background:#ffc400}
.w01-hotspot-dot.green{background:#63d67c}
.w01-hotspot-dot.blue{background:#1d8ef3}
.w01-hotspot-pill{
  min-height:38px;padding:0 13px 0 15px;border-radius:20px;
  background:rgba(31,33,35,.84);color:#fff;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(7px);
  font-size:14px;font-weight:800;white-space:nowrap
}
.w01-hotspot-pill .arrow{font-size:18px;opacity:.85}

.w01-right-stack{
  position:absolute;right:17px;top:27px;z-index:18;
  width:223px;display:flex;flex-direction:column;gap:12px
}
.w01-floating-card{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(223,228,234,.95);
  border-radius:12px;padding:17px;
  box-shadow:0 8px 26px rgba(16,24,40,.12);
  backdrop-filter:blur(10px)
}
.w01-floating-title{
  display:flex;align-items:center;gap:10px;
  font-size:17px;font-weight:850;margin-bottom:12px
}
.w01-floating-title .inline-icon{width:20px;height:20px}
.w01-action-list{display:flex;flex-direction:column;gap:8px}
.w01-action-row{
  min-height:44px;border:1px solid #e2e6eb;border-radius:8px;background:#fff;
  display:grid;grid-template-columns:10px 1fr 12px;align-items:center;
  gap:10px;padding:0 10px;font-size:13px;font-weight:750;color:#46505c;
  cursor:pointer;text-align:left
}
.w01-action-dot{width:10px;height:10px;border-radius:50%}
.w01-action-dot.yellow{background:#ffc400}
.w01-action-dot.blue{background:#168cf3}
.w01-action-dot.gray{background:#bdc4ce}
.w01-info-copy{font-size:12.5px;color:#667085;line-height:1.7;margin:0}

.w01-potential{
  position:absolute;z-index:17;left:18px;bottom:18px;
  width:485px;min-height:114px;border-radius:13px;
  background:rgba(31,33,35,.83);color:#fff;
  display:grid;grid-template-columns:68px 1fr 48px;
  align-items:center;gap:14px;padding:17px 19px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);
  backdrop-filter:blur(8px)
}
.w01-potential-icon{
  width:55px;height:55px;border-radius:50%;background:rgba(255,212,0,.12);
  color:#ffd400;display:grid;place-items:center
}
.w01-potential-icon .inline-icon{width:29px;height:29px}
.w01-potential-title{font-size:21px;font-weight:850;margin-bottom:5px}
.w01-potential-copy{font-size:16px;color:#f5f6f7}
.w01-potential-action{
  width:42px;height:42px;border-radius:50%;border:0;
  background:rgba(255,212,0,.13);color:#ffd400;
  font-size:24px;cursor:pointer
}
.w01-potential-action:hover{background:rgba(255,212,0,.23)}

.w01-minimap{
  position:absolute;right:17px;bottom:18px;z-index:16;
  width:220px;height:136px;border-radius:12px;
  background:rgba(28,30,32,.82);border:1px solid rgba(255,255,255,.18);
  overflow:hidden;backdrop-filter:blur(8px)
}
.w01-plan{
  position:absolute;left:35px;top:27px;width:146px;height:76px;
  border:1px solid rgba(255,255,255,.54)
}
.w01-plan:before,.w01-plan:after{
  content:"";position:absolute;border:1px solid rgba(255,255,255,.36)
}
.w01-plan:before{left:29px;top:12px;width:67px;height:46px}
.w01-plan:after{left:96px;top:17px;width:34px;height:50px}
.w01-plan-line{
  position:absolute;left:57px;top:42px;width:82px;height:1px;
  background:rgba(255,255,255,.28);transform:rotate(-6deg)
}
.w01-map-marker{
  position:absolute;left:93px;top:71px;width:18px;height:18px;border-radius:50%;
  background:#ffd400;z-index:2
}
.w01-map-cone{
  position:absolute;left:79px;top:35px;width:58px;height:58px;
  background:conic-gradient(from 310deg,rgba(255,212,0,.55),rgba(255,212,0,.10) 28%,transparent 29%);
  border-radius:50%
}

.w01-filmstrip{
  min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:11px
}
.w01-scene{
  position:relative;overflow:hidden;border-radius:9px;border:2px solid transparent;
  background:#cbd4d9;cursor:pointer;padding:0;text-align:left
}
.w01-scene.active{border-color:#ffd400}
.w01-scene-media{position:absolute;inset:0}
.w01-scene-media.s1{background:linear-gradient(160deg,#8ec4f0 0 42%,#7e9075 43% 66%,#6d5c4d 67%)}
.w01-scene-media.s2{background:linear-gradient(160deg,#d7e1e6 0 42%,#b7aea0 43% 62%,#6f766f 63%)}
.w01-scene-media.s3{background:linear-gradient(165deg,#ccd8df 0 42%,#8a999f 43% 64%,#646d69 65%)}
.w01-scene-media.s4{background:linear-gradient(160deg,#c4d2da 0 45%,#829399 46% 63%,#626d69 64%)}
.w01-scene-media.s5{background:linear-gradient(160deg,#becbd2 0 42%,#839095 43% 63%,#59625f 64%)}
.w01-scene-caption{
  position:absolute;left:0;right:0;bottom:0;
  padding:25px 11px 9px;
  background:linear-gradient(transparent,rgba(17,18,20,.82));color:#fff
}
.w01-scene-index{font-size:12px;opacity:.92}
.w01-scene-name{font-size:15px;font-weight:850;margin-top:2px}

.w01-raw .w01-hotspot,
.w01-raw .w01-right-stack,
.w01-raw .w01-potential{display:none}

.w01-zoom-in{transform:scale(1.035);transform-origin:center;transition:.18s}


/* ============================================================
   v1.0 — W01 Interaction & Alignment Fix
   ============================================================ */

/* Header right cluster: avatar removed, two controls share one axis */
.w01-header{
  grid-template-columns:450px 1fr 468px;
}
.w01-header-right{
  display:grid;
  grid-template-columns:228px 226px;
  align-items:center;
  justify-content:end;
  gap:14px;
}
.w01-context-btn,
.w01-review-btn{
  height:58px;
}
.w01-review-btn{
  width:226px;
  justify-content:space-between;
}
.w01-avatar{display:none!important}

/* Viewer right rail: one layout system, not separately positioned elements */
.w01-overlay-rail{
  position:absolute;
  right:17px;
  top:27px;
  z-index:20;
  display:grid;
  grid-template-columns:49px 223px;
  gap:14px;
  align-items:start;
}
.w01-controls{
  position:static;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.w01-right-stack{
  position:static;
  width:223px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.w01-minimap{
  position:absolute;
  right:17px;
  bottom:18px;
  z-index:16;
  width:223px;
}

/* Reserve the right rail area for controls/cards/minimap */
.w01-viewer{
  --overlay-rail-width:286px;
}
.w01-hotspot{
  max-width:calc(100% - var(--overlay-rail-width) - 24px);
}

/* Regeneration potential card is informational only */
.w01-potential{
  grid-template-columns:68px 1fr;
  width:485px;
}
.w01-potential-action{display:none!important}

/* Keep action panel copy aligned with D01 contract */
.w01-action-row{
  grid-template-columns:10px 1fr 12px;
}

/* Slight visual refinement so context and review action share baseline */
.w01-context-title{
  line-height:1.15;
}
.w01-review-btn{
  padding:0 22px;
}

/* No click affordance on compass */
.w01-compass{
  cursor:default;
}


/* ============================================================
   v1.1 — Creation Flow + W01 Polish
   ============================================================ */

/* Creation Flow header: no avatar, exit action aligns to global right padding */
.topbar{
  grid-template-columns:430px 1fr 220px;
}
.top-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:0;
}
.top-actions .ghost-btn{
  margin-left:auto;
}

/* C01 vertical rhythm */
#c01 .form-row{
  margin-bottom:16px;
}
#c01 .char-count{
  margin-top:4px;
  padding-right:6px;
}
#c01 .field-error:empty{
  display:none;
}
.demo-select-note{
  display:none!important;
}

/* W01 header CTA arrow is a real icon */
.w01-review-btn{
  justify-content:space-between;
}
.w01-arrow-icon{
  width:18px;
  height:18px;
  flex:none;
  stroke:#fff;
}

/* Regeneration potential: compact informational summary */
.w01-potential{
  width:342px;
  min-height:98px;
  grid-template-columns:54px 1fr;
  gap:12px;
  padding:14px 16px;
}
.w01-potential-icon{
  width:48px;
  height:48px;
}
.w01-potential-icon .inline-icon{
  width:25px;
  height:25px;
}
.w01-potential-title{
  font-size:19px;
  margin-bottom:4px;
}
.w01-potential-copy{
  font-size:14.5px;
  line-height:1.45;
}

/* MiniMap removed from V0 */
.w01-minimap,
.w01-plan,
.w01-plan-line,
.w01-map-marker,
.w01-map-cone{
  display:none!important;
}

/* Viewer overlay layout states */
.w01-viewer .w01-overlay-rail{
  right:17px;
  top:27px;
  grid-template-columns:49px 223px;
  gap:14px;
}
.w01-viewer.w01-raw .w01-overlay-rail{
  grid-template-columns:49px;
  gap:0;
  right:17px;
}
.w01-viewer.w01-raw .w01-right-stack{
  display:none;
}
.w01-viewer.w01-raw .w01-controls{
  grid-column:1;
}

/* Keep raw mode clean: controls stay at the actual viewer edge */
.w01-viewer.w01-raw .w01-control{
  margin:0;
}


/* ============================================================
   v1.2 — W01 Viewer Controls & Overlay Layout
   ============================================================ */

/* Active state: shallow yellow surface only, no vertical stripe */
.w01-nav-item.active:before{
  display:none!important;
}

/* Fixed UI icon sizing for W01 */
.w01-context-chevron{
  width:20px;
  height:20px;
  stroke:#667085;
}
.w01-arrow-icon{
  width:18px;
  height:18px;
  stroke:#fff;
}
.w01-item-chevron{
  width:17px;
  height:17px;
  stroke:#667085;
}
.w01-hotspot-chevron{
  width:15px;
  height:15px;
  stroke:#fff;
  opacity:.88;
}
.w01-control-icon{
  width:22px;
  height:22px;
  stroke:#fff;
}

/* Viewer control / information layout:
   lightweight controls stay at the top-right;
   information panels begin lower to preserve panorama visibility. */
.w01-overlay-rail{
  position:absolute;
  right:17px;
  top:27px;
  z-index:20;
  width:223px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:0;
}
.w01-controls{
  position:static!important;
  width:49px;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-self:flex-end;
}
.w01-right-stack{
  position:static!important;
  width:223px;
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:28px;
  align-self:stretch;
}

/* Raw view: info panels disappear; controls remain anchored to the actual viewer edge. */
.w01-viewer.w01-raw .w01-right-stack{
  display:none!important;
}
.w01-viewer.w01-raw .w01-overlay-rail{
  width:49px;
  right:17px;
}
.w01-viewer.w01-raw .w01-controls{
  width:49px;
  align-self:flex-end;
}

/* Fullscreen control removed. Compass is an indicator, not a button. */
.w01-compass{
  cursor:default!important;
}

/* Real zoom operates on the scene content only, never on UI overlays. */
.w01-scene-layer{
  position:absolute;
  inset:0;
  transform-origin:center center;
  will-change:transform;
  transition:transform 180ms ease;
}
.w01-panorama-surface{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 18%,rgba(255,255,255,.72),transparent 17%),
    linear-gradient(180deg,#8ec5ff 0%,#c5e1f0 42%,#688676 43%,#8b8f78 62%,#806a54 100%);
}
.w01-panorama-surface:before{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:47%;
  background:
    linear-gradient(160deg,rgba(39,49,44,.0) 0 24%,rgba(58,68,60,.23) 24% 25%,transparent 25% 100%),
    repeating-linear-gradient(10deg,rgba(255,255,255,.06) 0 12px,rgba(22,28,25,.055) 12px 24px);
}
.w01-panorama-surface:after{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:21%;
  background:linear-gradient(90deg,rgba(64,50,34,.35),transparent);
  pointer-events:none;
}

/* Background moved from viewer container to scene layer. */
.w01-viewer{
  background:#dce6ec!important;
}
.w01-viewer:before,
.w01-viewer:after{
  display:none!important;
}

.w01-control:disabled{
  opacity:.42;
  cursor:not-allowed;
}

/* Keep the hotspot labels above the panorama surface inside the zoomable scene layer. */
#w01HotspotLayer{
  position:absolute;
  inset:0;
  z-index:12;
}

/* The cards remain comfortably below the top controls. */
@media (min-width:1200px){
  .w01-right-stack{
    margin-top:30px;
  }
}


/* ============================================================
   v1.3 — Visual Contract Pass
   ViewerControl + HotspotChip only
   ============================================================ */

/* ---------- ViewerControl family ---------- */

.w01-controls{
  width:52px!important;
  gap:10px!important;
  align-items:stretch!important;
}

/* Orientation indicator:
   dark translucent surface + light keyline + soft shadow. */
.w01-orientation-indicator{
  width:52px;
  height:62px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  border-radius:13px;
  background:rgba(38,44,49,.84);
  border:1px solid rgba(255,255,255,.50);
  box-shadow:
    0 2px 8px rgba(0,0,0,.20),
    inset 0 0 0 1px rgba(255,255,255,.05);
  backdrop-filter:blur(8px);
  color:#fff;
  cursor:default;
  user-select:none;
}

.w01-orientation-arrow{
  width:0;
  height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-bottom:12px solid #ffd400;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));
}

.w01-orientation-label{
  font-size:22px;
  line-height:1;
  font-weight:500;
  letter-spacing:.02em;
}

/* One shared two-segment zoom container. */
.w01-zoom-group{
  width:52px;
  height:94px;
  box-sizing:border-box;
  display:grid;
  grid-template-rows:1fr 1fr;
  overflow:hidden;
  border-radius:13px;
  background:rgba(38,44,49,.84);
  border:1px solid rgba(255,255,255,.50);
  box-shadow:
    0 2px 8px rgba(0,0,0,.20),
    inset 0 0 0 1px rgba(255,255,255,.05);
  backdrop-filter:blur(8px);
}

.w01-zoom-segment{
  appearance:none;
  width:100%;
  height:100%;
  border:0;
  border-radius:0;
  background:transparent;
  color:#fff;
  display:grid;
  place-items:center;
  padding:0;
  margin:0;
  cursor:pointer;
  transition:
    background-color .15s ease,
    opacity .15s ease,
    transform .08s ease;
}

.w01-zoom-in{
  border-bottom:1px solid rgba(255,255,255,.24);
}

.w01-zoom-segment:hover:not(:disabled){
  background:rgba(255,255,255,.08);
}

.w01-zoom-segment:active:not(:disabled){
  background:rgba(255,255,255,.04);
  transform:scale(.97);
}

.w01-zoom-segment:disabled{
  opacity:.42;
  cursor:not-allowed;
  background:transparent;
}

.w01-control-icon{
  width:22px!important;
  height:22px!important;
  stroke:#fff!important;
  stroke-width:2!important;
}

/* Hide the old independent-square styles from this family. */
.w01-controls > .w01-control,
.w01-compass{
  display:none!important;
}

/* Raw view retains the exact same control geometry at the viewer edge. */
.w01-viewer.w01-raw .w01-controls{
  width:52px!important;
}


/* ---------- HotspotChip family ---------- */

.w01-hotspot{
  display:inline-flex!important;
  align-items:center!important;
  gap:8px!important;
  border:0!important;
  background:transparent!important;
  padding:0!important;
  cursor:pointer!important;
  color:inherit;
}

/* Overall marker shell carries only the outer shadow.
   White ring and inner dot remain separate layers. */
.w01-hotspot-marker{
  position:relative;
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));
}

/* Outer white ring. */
.w01-hotspot-ring{
  width:36px;
  height:36px;
  box-sizing:border-box;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.98);
  display:grid;
  place-items:center;
  background:transparent;
}

/* The visible panorama/background gap is created by making the
   dot smaller than the ring's inner diameter. */
.w01-hotspot-dot{
  width:24px!important;
  height:24px!important;
  border:0!important;
  border-radius:50%;
  box-shadow:none!important;
  display:block;
}

.w01-hotspot-dot.yellow{background:#ffc400!important}
.w01-hotspot-dot.green{background:#63d67c!important}
.w01-hotspot-dot.blue{background:#1d8ef3!important}
.w01-hotspot-dot.gray{background:#b7bfca!important}

/* Label pill with a visible light keyline and restrained translucency. */
.w01-hotspot-pill{
  min-height:38px!important;
  box-sizing:border-box;
  padding:0 12px 0 16px!important;
  border-radius:999px!important;
  background:rgba(35,35,35,.86)!important;
  border:1px solid rgba(255,255,255,.56)!important;
  box-shadow:
    0 2px 8px rgba(0,0,0,.20),
    inset 0 0 0 1px rgba(255,255,255,.025)!important;
  backdrop-filter:blur(8px);
  color:#fff;
  display:inline-grid!important;
  grid-template-columns:auto auto 16px;
  align-items:center!important;
  column-gap:7px!important;
  white-space:nowrap;
}

.w01-hotspot-label,
.w01-hotspot-qty{
  font-size:14px;
  line-height:1;
  font-weight:760;
}

.w01-hotspot-qty{
  color:rgba(255,255,255,.92);
}

.w01-hotspot-chevron{
  width:15px!important;
  height:15px!important;
  stroke:#fff!important;
  stroke-width:2!important;
  opacity:.90;
  justify-self:end;
}

/* Hover/pressed feedback applies to the combined hotspot, not just the chevron. */
.w01-hotspot:hover .w01-hotspot-pill{
  background:rgba(45,45,45,.92)!important;
}

.w01-hotspot:hover .w01-hotspot-marker{
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.34));
}

.w01-hotspot:active{
  transform:translate(-12px,-50%) scale(.985)!important;
}


/* ============================================================
   v1.4 — C02 + W01 Primary CTA Alignment
   ============================================================ */

/* C02 bottom action row: true two-end alignment */
.upload-actions{
  display:flex!important;
  justify-content:space-between!important;
  align-items:center!important;
  margin-top:24px!important;
  width:100%;
}

/* The CTA is a direct child of the action row, so its right edge
   aligns with the C02 content area's right padding. */
.upload-actions > .primary-btn{
  margin-left:auto;
}

/* Shared forward-action button contract:
   centered label + same fixed ArrowRight slot on the right. */
.primary-cta-with-arrow{
  position:relative!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  gap:0!important;
}

.primary-cta-arrow{
  position:absolute;
  right:20px;
  width:18px!important;
  height:18px!important;
  stroke:#fff!important;
  stroke-width:2!important;
  flex:none;
}

/* Remove legacy text-arrow spacing if older markup/styles remain. */
.primary-btn .arrow{
  display:none!important;
}

/* C02 helper explanation is no longer part of the product UI. */
.provisional-action-note{
  display:none!important;
}

/* W01 uses the same trailing-arrow system; keep the label centered. */
.w01-review-btn.primary-cta-with-arrow{
  justify-content:center!important;
  gap:0!important;
}

/* Retire the older page-specific arrow class. */
.w01-arrow-icon{
  display:none!important;
}


/* ============================================================
   v1.5 — Remove trailing arrows from C02 + W01 CTA
   ============================================================ */
.primary-cta-arrow{
  display:none!important;
}
.primary-cta-with-arrow{
  gap:0!important;
}

function applyW01Zoom(){
  const layer=document.getElementById('w01SceneLayer');
  const zoomIn=document.getElementById('w01ZoomIn');
  const zoomOut=document.getElementById('w01ZoomOut');
  if(layer) layer.style.transform=`scale(${w01Zoom.toFixed(2)})`;
  if(zoomIn) zoomIn.disabled=w01Zoom >= W01_ZOOM_MAX-0.001;
  if(zoomOut) zoomOut.disabled=w01Zoom <= W01_ZOOM_MIN+0.001;
}

function bindW01(){
  bindW01Dynamic();

  const viewer=document.getElementById('w01Viewer');
  const raw=document.getElementById('w01RawBtn');
  const regen=document.getElementById('w01RegenBtn');
  raw.onclick=()=>{
    viewer.classList.add('w01-raw');
    raw.classList.add('active');regen.classList.remove('active');
  };
  regen.onclick=()=>{
    viewer.classList.remove('w01-raw');
    regen.classList.add('active');raw.classList.remove('active');
  };

  const ctx=document.getElementById('w01Context');
  const ctxBtn=document.getElementById('w01ContextBtn');
  ctxBtn.onclick=(e)=>{
    e.stopPropagation();
    const open=!ctx.classList.contains('open');
    ctx.classList.toggle('open',open);
    ctxBtn.setAttribute('aria-expanded',String(open));
  };
  document.getElementById('w01NewProject').onclick=()=>{
    ctx.classList.remove('open');
    show('c01');
  };

  const review=()=>showW02('draft');
  document.getElementById('w01ReviewBtn').onclick=review;
  document.getElementById('w01SidebarReview').onclick=review;

  document.querySelectorAll('.w01-action-row').forEach(btn=>{
    btn.onclick=()=>openD01(btn.dataset.focus);
  });

  document.getElementById('w01ZoomIn').onclick=()=>{
    w01Zoom=Math.min(W01_ZOOM_MAX,Number((w01Zoom+W01_ZOOM_STEP).toFixed(2)));
    applyW01Zoom();
  };
  document.getElementById('w01ZoomOut').onclick=()=>{
    w01Zoom=Math.max(W01_ZOOM_MIN,Number((w01Zoom-W01_ZOOM_STEP).toFixed(2)));
    applyW01Zoom();
  };
  applyW01Zoom();

  document.addEventListener('click',()=>{
    if(ctx.classList.contains('open')){
      ctx.classList.remove('open');
      ctxBtn.setAttribute('aria-expanded','false');
    }
  });
}

function renderD01MaterialTree(){
  const root=document.getElementById('d01MaterialTree');
  if(!root) return;
  root.innerHTML=D01_TREE_FIXTURE.map(material=>{
    const materialOpen=d01TreeOpenMaterials.has(material.id);
    const batchCount=material.types.reduce((sum,t)=>sum+t.batches.length,0);
    const typesHtml=materialOpen?`
      <div class="d01-tree-branch d01-tree-material-children">
        ${material.types.map(type=>{
          const typeOpen=d01TreeOpenTypes.has(type.id);
          const batchesHtml=typeOpen?`
            <div class="d01-tree-branch inner">
              ${type.batches.map(batchId=>{
                const batch=D01_BATCH_FIXTURE[batchId];
                return `<button class="d01-tree-row level-2 d01-batch-row ${batchId===d01CurrentBatchId?'active':''}" type="button" data-batch-id="${batchId}">
                  <span>${batch.group}</span>
                  <span class="d01-tree-count">${batch.qty}件</span>
                </button>`;
              }).join('')}
            </div>`:'';
          return `<div class="d01-tree-type-block">
            <button class="d01-tree-row level-1 d01-tree-toggle" type="button" data-type-id="${type.id}" aria-expanded="${typeOpen}">
              <span class="d01-tree-chevron">${icon(typeOpen?'chevronDown':'chevronRight','d01-tree-chevron-icon')}</span>
              <span class="d01-mini-swatch ${material.tone}"></span>
              <span class="d01-tree-label">${type.label}</span>
              <span class="d01-tree-count">${type.batches.length}组</span>
            </button>
            ${batchesHtml}
          </div>`;
        }).join('')}
      </div>`:'';
    return `<div class="d01-tree-material-block">
      <button class="d01-tree-row level-0 d01-tree-toggle" type="button" data-material-id="${material.id}" aria-expanded="${materialOpen}">
        <span class="d01-tree-chevron">${icon(materialOpen?'chevronDown':'chevronRight','d01-tree-chevron-icon')}</span>
        <span class="d01-material-swatch ${material.tone}"></span>
        <span class="d01-tree-label">${material.label}</span>
        <span class="d01-tree-count">${batchCount}组</span>
      </button>
      ${typesHtml}
    </div>`;
  }).join('');

  root.querySelectorAll('[data-material-id]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.materialId;
      if(d01TreeOpenMaterials.has(id)) d01TreeOpenMaterials.delete(id);
      else d01TreeOpenMaterials.add(id);
      renderD01MaterialTree();
    };
  });
  root.querySelectorAll('[data-type-id]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.typeId;
      if(d01TreeOpenTypes.has(id)) d01TreeOpenTypes.delete(id);
      else d01TreeOpenTypes.add(id);
      renderD01MaterialTree();
    };
  });
  root.querySelectorAll('[data-batch-id]').forEach(btn=>{
    btn.onclick=()=>switchD01Batch(btn.dataset.batchId);
  });
}

function d01CurrentInstance(){
  return d01Instances[d01CurrentInstanceIndex];
}
function d01InstanceIsVerified(inst){
  return D01_VERIFICATION_KEYS.every(key=>!!inst.saved[key]);
}
function d01VerifiedInstanceCount(){
  return d01Instances.filter(d01InstanceIsVerified).length;
}
function d01FieldVerifiedCount(key){
  return d01Instances.filter(inst=>!!inst.saved[key]).length;
}
function d01FactsDirty(inst=d01CurrentInstance()){
  return D01_VERIFICATION_KEYS.some(key=>inst.draft[key]!==inst.saved[key])
    || (inst.draft.note||'')!==(inst.saved.note||'');
}
function d01HasMaterialVariance(){
  return D01_VERIFICATION_KEYS.some(key=>{
    const values=d01Instances.map(inst=>inst.saved[key]).filter(Boolean);
    return new Set(values).size>1;
  });
}
function d01DiscardCurrentDraft(){
  const inst=d01CurrentInstance();
  inst.draft=d01CloneFacts(inst.saved);
}
function d01CurrentInstanceStatus(inst=d01CurrentInstance()){
  if(d01InstanceIsVerified(inst)) return '已核实';
  const any=D01_VERIFICATION_KEYS.some(k=>!!inst.saved[k]) || !!inst.saved.note;
  return any?'进行中':'未核实';
}

function renderD01InstanceStrip(){
  const strip=document.getElementById('d01InstanceStrip');
  if(!strip) return;
  strip.innerHTML=d01Instances.map((inst,idx)=>{
    const status=d01CurrentInstanceStatus(inst);
    const stateClass=status==='已核实'?'verified':status==='进行中'?'progress':'unverified';
    return `<button class="d01-instance-chip ${stateClass} ${idx===d01CurrentInstanceIndex?'active':''}" type="button" data-instance-index="${idx}">
      <span class="d01-instance-index">${String(inst.displayIndex).padStart(2,'0')}</span>
      <span class="d01-instance-status">${status}</span>
    </button>`;
  }).join('');

  strip.querySelectorAll('.d01-instance-chip').forEach(btn=>{
    btn.onclick=()=>{
      const next=Number(btn.dataset.instanceIndex);
      if(next===d01CurrentInstanceIndex) return;
      if(d01FactsDirty()){
        const discard=window.confirm('当前实例有尚未保存的修改。是否放弃这些修改并切换实例？');
        if(!discard) return;
        d01DiscardCurrentDraft();
      }
      d01CurrentInstanceIndex=next;
      renderD01State();
      renderD01Options();
      updateD01SaveButton();
      document.getElementById('d01SaveNotice').textContent='';
    };
  });
}

function renderD01VerificationSummary(){
  const list=document.getElementById('d01VerificationSummaryList');
  if(!list) return;
  list.innerHTML=Object.keys(d01VerificationPrompts).map((key,idx)=>{
    const done=d01FieldVerifiedCount(key);
    const complete=done===d01Instances.length;
    return `<button class="d01-verification-summary-row" type="button" data-focus="${key}">
      <span class="d01-number-badge ${complete?'done':''}">${complete?icon('check','d01-row-check'):idx+1}</span>
      <span><strong>${d01VerificationPrompts[key].label}</strong><small>${done} / ${d01Instances.length} 已核实</small></span>
      <span class="d01-row-status ${complete?'done':''}">${complete?'已完成':'待核实'}</span>
    </button>`;
  }).join('');

  list.querySelectorAll('.d01-verification-summary-row').forEach(btn=>{
    btn.onclick=()=>focusD01Target(btn.dataset.focus);
  });
}

function renderD01State(){
  const verified=d01VerifiedInstanceCount();
  const hasVariance=d01HasMaterialVariance();
  const supported=verified===d01Instances.length && !hasVariance;
  const evidenceText=supported?'有依据':'条件性';
  const current=d01CurrentInstance();

  document.getElementById('d01EvidenceText').textContent=evidenceText;
  document.getElementById('d01VerificationProgress').textContent=`${verified} / ${d01Instances.length}件`;
  document.getElementById('d01SummaryEvidence').textContent=evidenceText;
  document.getElementById('d01SummaryPending').textContent=`已核实 ${verified} / ${d01Instances.length}件`;
  document.getElementById('d01HumanProgressBadge').textContent=`已核实 ${verified} / ${d01Instances.length}件`;
  document.getElementById('d01CurrentInstanceLabel').textContent=`${d01Batch().group} · 实例 ${String(current.displayIndex).padStart(2,'0')}`;
  document.getElementById('d01CurrentInstanceState').textContent=d01CurrentInstanceStatus(current);

  const warning=document.getElementById('d01GroupWarning');
  warning.hidden=!hasVariance;

  const dot=document.getElementById('d01SummaryEvidenceDot');
  dot.classList.toggle('supported',supported);
  dot.classList.toggle('conditional',!supported);

  const meta=document.getElementById('d01EvidenceMeta');
  meta.classList.toggle('supported',supported);
  meta.classList.toggle('conditional',!supported);
  meta.querySelector('.d01-meta-dot').classList.toggle('green',supported);
  meta.querySelector('.d01-meta-dot').classList.toggle('yellow',!supported);

  D01_VERIFICATION_KEYS.forEach(key=>{
    const state=document.getElementById(`d01-state-${key}`);
    const saved=!!current.saved[key];
    state.textContent=saved?'已核实':'待核实';
    state.classList.toggle('done',saved);
  });

  renderD01InstanceStrip();
  renderD01VerificationSummary();
}

function renderD01Options(){
  const current=d01CurrentInstance();
  document.querySelectorAll('.d01-option-card').forEach(btn=>{
    const key=btn.dataset.field;
    const selected=current.draft[key]===btn.dataset.value;
    btn.classList.toggle('selected',selected);
  });
  const note=document.getElementById('d01VerificationNote');
  if(note) note.value=current.draft.note||'';
}

function updateD01SaveButton(){
  const dirty=d01FactsDirty();
  const btn=document.getElementById('d01SaveVerification');
  btn.disabled=!dirty || d01Saving;
  btn.textContent=d01Saving?'保存中…':'保存当前实例';
}

function focusD01Target(target){
  d01FocusTarget=target||'';
  if(target==='local_opportunity'){
    document.getElementById('d01LocalOpportunity')?.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const field=document.getElementById(`d01-field-${target}`);
  const section=document.getElementById('d01HumanVerification');
  (field||section)?.scrollIntoView({behavior:'smooth',block:'center'});
  if(field){
    field.classList.add('focus-pulse');
    setTimeout(()=>field.classList.remove('focus-pulse'),900);
  }
}


function applyD01BatchContext(){
  const batch=d01Batch();
  const primary=batch.primary===true;

  const titleLabel=primary?'木质围栏':batch.type;
  document.getElementById('d01ObjectTitle').textContent=`${titleLabel} · ${batch.group}`;
  document.getElementById('d01QuantityPill').textContent=`× ${batch.qty}件`;
  document.getElementById('d01Breadcrumb').innerHTML=`HSBC MKK <span>/</span> ${batch.scene} · ${batch.sceneName} <span>/</span> ${batch.material} <span>/</span> ${batch.type} <span>/</span> ${batch.group}`;

  document.getElementById('d01SummaryMaterial').textContent=batch.material;
  document.getElementById('d01SummaryMaterialEn').textContent=batch.materialEn;
  document.getElementById('d01SummaryType').textContent=batch.type;
  document.getElementById('d01SummaryTypeEn').textContent=batch.typeEn;
  document.getElementById('d01SummaryGroup').textContent=batch.group;
  document.getElementById('d01SummaryQuantity').textContent=`${batch.qty}件`;
  document.getElementById('d01SummaryScene').textContent=batch.scene;
  document.getElementById('d01SummarySceneName').textContent=batch.sceneName;

  document.getElementById('d01RecommendationPill').textContent=primary?'修复翻新':'主路径待确认';
  document.getElementById('d01SummaryPathway').textContent=primary?'修复翻新':'待确认';
  document.getElementById('d01PathwayValue').textContent=primary?'修复翻新':'主路径待确认';
  document.getElementById('d01AssessmentRationale').textContent=primary
    ? '现有构件整体结构仍具保留价值，但表面处理与隐藏损伤仍需核实；建议确认可拆卸性后进行修复翻新。'
    : '当前分组已进入同一 D01 评估工作流；主路径将在结合现场证据与逐件人工核实后确认。';

  document.getElementById('d01EvidenceCount').textContent=`共 ${d01EvidenceAssetCount} 张`;
}

function switchD01Batch(batchId){
  if(!D01_BATCH_FIXTURE[batchId]) return;
  if(d01FactsDirty()){
    const discard=window.confirm('当前实例有尚未保存的修改。是否放弃这些修改并切换评估分组？');
    if(!discard) return;
    d01DiscardCurrentDraft();
  }

  d01CurrentBatchId=batchId;
  const session=d01EnsureBatchState(batchId);
  d01Instances=session.instances;
  d01EvidenceAssetCount=session.evidenceCount;
  d01AddedEvidenceFiles=session.addedFiles;
  d01CurrentInstanceIndex=0;

  const batch=d01Batch();
  d01TreeOpenMaterials.add(batch.materialId);
  d01TreeOpenTypes.add(batch.typeId);

  applyD01BatchContext();
  renderD01MaterialTree();
  renderD01State();
  renderD01Options();
  updateD01SaveButton();
  document.getElementById('d01SaveNotice').textContent='';
  document.querySelector('.d01-main')?.scrollTo({top:0,behavior:'smooth'});
}

function openD01(focus='',entry='view'){
  d01EntryContext=String(entry).startsWith('review')?entry:'view';
  show('d01');
  applyD01BatchContext();
  renderD01MaterialTree();
  renderD01State();
  renderD01Options();
  updateD01SaveButton();

  const back=document.getElementById('d01Back');
  const viewNav=document.getElementById('d01NavView');
  const reviewNav=document.getElementById('d01NavReview');
  const fromReview=String(entry).startsWith('review');
  if(back) back.querySelector('span').textContent=fromReview?'返回项目审查':'返回再生视图';
  if(viewNav) viewNav.classList.toggle('active',!fromReview);
  if(reviewNav) reviewNav.classList.toggle('active',fromReview);

  setTimeout(()=>{ if(focus) focusD01Target(focus); },60);
}

function bindD01(){
  document.getElementById('d01Back').onclick=()=>{
    if(String(d01EntryContext).startsWith('review')){
      const sourceTab=d01EntryContext==='review-verification'?'verification':'draft';
      showW02(sourceTab,true);
    }else{
      show('w01');
      renderW01Scene();
      applyW01Zoom();
    }
  };
  document.getElementById('d01NavView').onclick=()=>{
    show('w01');
    renderW01Scene();
    applyW01Zoom();
  };
  document.getElementById('d01NavReview').onclick=()=>showW02();

  renderD01MaterialTree();
  applyD01BatchContext();

  const ctx=document.getElementById('d01Context');
  const ctxBtn=document.getElementById('d01ContextBtn');
  ctxBtn.onclick=(e)=>{
    e.stopPropagation();
    const open=!ctx.classList.contains('open');
    ctx.classList.toggle('open',open);
    ctxBtn.setAttribute('aria-expanded',String(open));
  };
  document.getElementById('d01NewProject').onclick=()=>{
    ctx.classList.remove('open');
    show('c01');
  };

  document.querySelectorAll('.d01-option-card').forEach(btn=>{
    btn.onclick=()=>{
      const current=d01CurrentInstance();
      current.draft[btn.dataset.field]=btn.dataset.value;
      renderD01Options();
      updateD01SaveButton();
      document.getElementById('d01SaveNotice').textContent='';
    };
  });

  document.getElementById('d01VerificationNote').addEventListener('input',(e)=>{
    d01CurrentInstance().draft.note=e.target.value;
    updateD01SaveButton();
  });

  document.getElementById('d01SaveVerification').onclick=()=>{
    if(d01Saving) return;
    d01Saving=true;
    updateD01SaveButton();
    const current=d01CurrentInstance();
    document.getElementById('d01SaveNotice').textContent=`正在保存实例 ${String(current.displayIndex).padStart(2,'0')}…`;
    setTimeout(()=>{
      current.saved=d01CloneFacts(current.draft);
      d01Saving=false;
      renderD01State();
      renderD01Options();
      updateD01SaveButton();

      const verified=d01VerifiedInstanceCount();
      const hasVariance=d01HasMaterialVariance();
      document.getElementById('d01SaveNotice').textContent=hasVariance
        ? `实例 ${String(current.displayIndex).padStart(2,'0')} 已保存；组内核实结果存在差异，建议复核分组。`
        : `实例 ${String(current.displayIndex).padStart(2,'0')} 已保存。当前已核实 ${verified} / ${d01Instances.length}件。`;
      toast('当前实例核实结果已保存');
    },650);
  };

  const addPhotoTile=document.getElementById('d01AddPhotoTile');
  const evidenceInput=document.getElementById('d01EvidenceInput');
  addPhotoTile.onclick=()=>evidenceInput.click();
  evidenceInput.onchange=(e)=>{
    const files=[...(e.target.files||[])];
    if(!files.length) return;
    d01AddedEvidenceFiles.push(...files);
    d01EvidenceAssetCount+=files.length;
    const session=d01EnsureBatchState(d01CurrentBatchId);
    session.evidenceCount=d01EvidenceAssetCount;
    session.addedFiles=d01AddedEvidenceFiles;
    document.getElementById('d01EvidenceCount').textContent=`共 ${d01EvidenceAssetCount} 张`;
    toast(`已添加 ${files.length} 张现场补充照片`);
    evidenceInput.value='';
  };

  document.getElementById('d01GoVerification').onclick=()=>focusD01Target('fixing_method');
  document.getElementById('d01PathwayDetail').onclick=()=>toast('Pathway Detail：下一层页面按已确认 D01 child layer 接入');
  document.getElementById('d01Open360').onclick=()=>toast('360 Evidence Viewer：下一层沉浸查看层待接入');
  document.getElementById('d01ReferenceAll').onclick=()=>toast('参考来源：下一步接入 Source Drawer / Expand');
  document.querySelectorAll('.d01-reference-item,.d01-guideline-row').forEach(btn=>{
    btn.onclick=()=>toast('参考来源详情：下一步接入 Source Drawer');
  });
  document.getElementById('d01LocalAll').onclick=()=>toast('Local Opportunity Detail：下一层页面待接入');

  document.addEventListener('click',()=>{
    if(ctx.classList.contains('open')){
      ctx.classList.remove('open');
      ctxBtn.setAttribute('aria-expanded','false');
    }
  });

  renderD01State();
  renderD01Options();
  updateD01SaveButton();
}

function w02FilteredDraftRows(){
  const f=w02DraftFilters;
  return W02_BATCHES.filter(row=>{
    if(f.material!=='all' && row.material!==f.material) return false;
    if(f.scene!=='all' && row.scene_id!==f.scene) return false;
    if(f.evidence!=='all' && row.evidence_status!==f.evidence) return false;
    if(f.review!=='all' && row.review_status!==f.review) return false;
    if(f.summary==='reviewed' && row.review_status!=='reviewed') return false;
    if(f.summary==='attention' && !row.attention) return false;
    const q=f.search.trim().toLowerCase();
    if(q && !`${row.batch_label} ${row.component_type} ${row.scene_name}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

    REFURBISH:{icon:'leaf',tone:'refurbish'},
    REPURPOSE:{icon:'layers',tone:'repurpose'},
    MATERIAL_RECOVERY:{icon:'recycle',tone:'recovery'},
    DISPOSAL:{icon:'trash2',tone:'disposal'}
  };
  const cfg=map[pathway]||map.REFURBISH;
  return `<span class="w02-pathway ${cfg.tone}">${icon(cfg.icon,'w02-path-icon')}<span>${W02_PATHWAY_LABELS[pathway]}</span></span>`;
}

function w02EscapeAttr(value){
  return String(value||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function w02VerificationMatchesCommon(row,{includeStatus=true}={}){
  const f=w02VerificationFilters;
  if(f.material!=='all' && row.material!==f.material) return false;
  if(f.scene!=='all' && row.scene_id!==f.scene) return false;
  if(f.type!=='all' && row.type!==f.type) return false;
  if(includeStatus){
    if(f.status==='active' && !['unverified','unable_to_verify'].includes(row.status)) return false;
    if(f.status!=='active' && f.status!=='all' && row.status!==f.status) return false;
  }
  const q=f.search.trim().toLowerCase();
  if(q && !`${row.batch_label} ${row.field} ${row.question} ${row.scene_name}`.toLowerCase().includes(q)) return false;
  return true;
}

function w02FilteredVerificationRows(){
  return W02_VERIFICATION_ITEMS.filter(row=>w02VerificationMatchesCommon(row));
}

function w02VerificationSummary(){
  // "待核实事项" remains the active work queue; other dimensions are calculated
  // from the same non-status filter/search context.
  const activeRows=W02_VERIFICATION_ITEMS.filter(row=>
    ['unverified','unable_to_verify'].includes(row.status) &&
    w02VerificationMatchesCommon(row,{includeStatus:false})
  );
  return {
    active:activeRows.length,
    batches:new Set(activeRows.map(r=>r.batch_id)).size,
    onsite:activeRows.filter(r=>r.type==='onsite_observation').length,
    document:activeRows.filter(r=>r.type==='document_check').length,
    specialist:activeRows.filter(r=>r.type==='specialist_review').length
  };
}

function w02MaterialTone(material){
  return {
    '木材':'wood',
    '金属':'metal',
    '玻璃':'glass',
    '混凝土':'concrete',
    '植栽':'planting',
    '其他':'other'
  }[material]||'other';
}

function w02VerificationMaterialGroups(rows){
  const allMaterials=[...new Set(W02_BATCHES.map(r=>r.material))];
  const isDefault=
    w02VerificationFilters.material==='all' &&
    w02VerificationFilters.scene==='all' &&
    w02VerificationFilters.type==='all' &&
    w02VerificationFilters.status==='active' &&
    w02VerificationFilters.search.trim()==='';

  return allMaterials
    .filter(material=>w02VerificationFilters.material==='all' || w02VerificationFilters.material===material)
    .map(material=>({material,rows:rows.filter(r=>r.material===material)}))
    .filter(group=>isDefault || group.rows.length>0);
}

function w02VerificationAccordion(group){
  const {material,rows}=group;
  const activeRows=rows.filter(r=>['unverified','unable_to_verify'].includes(r.status));
  const affectedBatches=new Set(activeRows.map(r=>r.batch_id)).size;
  const expanded=w02VerificationExpandedMaterial===material;
  const tone=w02MaterialTone(material);
  const countCopy=activeRows.length
    ? `${activeRows.length}项待核实（涉及${affectedBatches}个分组）`
    : '0项待核实（已全部确认）';

  return `<section class="w02-v-material ${expanded?'expanded':''}">
    <button type="button" class="w02-v-material-head" data-v-material-toggle="${material}" aria-expanded="${expanded}">
      <span class="w02-material-swatch ${tone}"></span>
      <span class="w02-v-material-copy"><strong>${material}</strong><small>${countCopy}</small></span>
      ${icon(expanded?'chevronDown':'chevronRight','w02-v-material-chevron')}
    </button>
    ${expanded?`<div class="w02-v-material-body">
      ${rows.length?rows.map(w02VerificationRow).join(''):
        `<div class="w02-v-zero">当前材料没有符合筛选条件的核实事项</div>`}
    </div>`:''}
  </section>`;
}

function w02VerificationRow(row){
  const batch=W02_BATCHES.find(r=>r.batch_id===row.batch_id);
  if(!batch) return '';

  let action=`<span class="w02-v-action-empty">—</span>`;
  if(row.status==='unverified' || row.status==='unable_to_verify'){
    const label=row.status==='unverified'?'去核实':'查看详情';
    action=`<button type="button" class="w02-v-action" data-v-item="${row.id}" data-v-batch="${row.batch_id}" data-v-focus="${row.focus||'human_verification'}"><span>${label}</span>${icon('chevronRight','w02-v-action-icon')}</button>`;
  }

  return `<div class="w02-v-task-row">
    <button type="button" class="w02-v-row-batch" data-v-open-batch="${row.batch_id}">
      ${w02Thumb(batch)}
      <span><strong>${row.batch_label}</strong><small>Scene${row.scene_id.slice(1).padStart(2,'0')} · ${row.scene_name}</small></span>
    </button>
    <span class="w02-v-field">${icon('search','w02-v-field-icon')}<span>${row.field}</span></span>
    <span class="w02-v-question">${row.question}</span>
    <span class="w02-v-status-cell">${w02VerificationStatusPill(row.status)}</span>
    <span class="w02-v-discovered"><strong>${row.discovered_at||'—'}</strong><small>${W02_DISCOVERY_SOURCE_LABELS[row.discovered_source]||'来源待确认'}</small></span>
    ${action}
  </div>`;
}

function w02VerificationAttentionRows(rows){
  const activeBatchIds=new Set(
    rows.filter(r=>['unverified','unable_to_verify'].includes(r.status)).map(r=>r.batch_id)
  );
  return W02_BATCHES.filter(r=>r.attention && activeBatchIds.has(r.batch_id));
}

function renderW02Verification(){
  const rows=w02FilteredVerificationRows();
  const summary=w02VerificationSummary();
  const groups=w02VerificationMaterialGroups(rows);

  // null means choose the default expanded material. '__collapsed__' preserves
  // an explicit user collapse instead of immediately reopening the first section.
  if(w02VerificationExpandedMaterial!=='__collapsed__' && !groups.some(g=>g.material===w02VerificationExpandedMaterial && g.rows.length)){
    const firstPending=groups.find(g=>g.rows.some(r=>['unverified','unable_to_verify'].includes(r.status)));
    const firstVisible=groups.find(g=>g.rows.length);
    w02VerificationExpandedMaterial=(firstPending||firstVisible||groups[0]||{}).material||null;
  }

  const attentionRows=w02VerificationAttentionRows(rows);
  const content=document.getElementById('w02Content');
  content.innerHTML=`
    <div class="w02-summary-grid w02-v-summary-grid">
      ${w02VerificationStatCard('待核实事项',summary.active,'项','circleHelp','warning')}
      ${w02VerificationStatCard('涉及评估分组',summary.batches,'个','cube','neutral')}
      ${w02VerificationStatCard('现场观察',summary.onsite,'项','camera','neutral')}
      ${w02VerificationStatCard('文件核对',summary.document,'项','doc','neutral')}
      ${w02VerificationStatCard('专业复核',summary.specialist,'项','userRound','neutral')}
    </div>

    <div class="w02-workspace">
      <section class="w02-table-panel w02-v-panel">
        <div class="w02-toolbar verification">
          <select id="w02VMaterial" aria-label="材料筛选">${w02FilterOptions([['all','全部材料'],...Array.from(new Set(W02_BATCHES.map(r=>r.material))).map(v=>[v,v])],w02VerificationFilters.material)}</select>
          <select id="w02VScene" aria-label="场景筛选">${w02FilterOptions([['all','全部场景'],...Array.from(new Map(W02_BATCHES.map(r=>[r.scene_id,r.scene_name])).entries()).map(([id,name])=>[id,name])],w02VerificationFilters.scene)}</select>
          <select id="w02VType" aria-label="核实类型筛选">${w02FilterOptions([['all','全部核实类型'],['onsite_observation','现场观察'],['document_check','文件核对'],['specialist_review','专业复核']],w02VerificationFilters.type)}</select>
          <select id="w02VStatus" aria-label="状态筛选">${w02FilterOptions([['active','待处理状态'],['all','全部状态'],['unverified','待核实'],['unable_to_verify','无法现场确认'],['verified','已核实'],['not_applicable','不适用']],w02VerificationFilters.status)}</select>
          <label class="w02-search">${icon('search')}<input id="w02VSearch" value="${w02EscapeAttr(w02VerificationFilters.search)}" placeholder="搜索分组 / 核实事项 / 说明 / 场景" /></label>
        </div>

        <div class="w02-v-global-head" aria-hidden="true">
          <span>构件 / 分组</span><span>待核实事项</span><span>相关说明</span><span>状态</span><span>发现于</span><span>操作</span>
        </div>

        <div class="w02-v-accordion">
          ${groups.length?groups.map(w02VerificationAccordion).join(''):
            `<div class="w02-empty"><strong>没有符合当前筛选条件的核实事项</strong><button type="button" id="w02VClearFilters">清除筛选</button></div>`}
        </div>
      </section>

      ${w02AttentionRail(attentionRows,'verification')}
    </div>`;

  bindW02VerificationControls();
}

function renderW02(){
  const draftTab=document.getElementById('w02TabDraft');
  const verificationTab=document.getElementById('w02TabVerification');
  draftTab?.classList.toggle('active',w02Tab==='draft');
  verificationTab?.classList.toggle('active',w02Tab==='verification');
  draftTab?.setAttribute('aria-selected',String(w02Tab==='draft'));
  verificationTab?.setAttribute('aria-selected',String(w02Tab==='verification'));

  const content=document.getElementById('w02Content');
  try{
    if(w02Tab==='draft') renderW02Draft();
    else renderW02Verification();
  }catch(error){
    console.error('W02 render failed:',error);
    if(content){
      content.innerHTML=`<div class="w02-runtime-error">
        <strong>项目审查暂时无法显示</strong>
        <span>${String(error?.message||error)}</span>
      </div>`;
    }
  }
}

function w02CaptureScroll(){
  w02ScrollState[w02Tab]=window.scrollY||0;
}

function showW02(tab=w02Tab,restoreScroll=false){
  w02Tab=tab==='verification'?'verification':'draft';
  show('w02');
  renderW02();
  if(restoreScroll){
    setTimeout(()=>window.scrollTo({top:w02ScrollState[w02Tab]||0,behavior:'auto'}),0);
  }
}

function w02RerenderPreserveInput(renderFn,inputId){
  const input=document.getElementById(inputId);
  const start=input?.selectionStart??null;
  const end=input?.selectionEnd??null;
  renderFn();
  const next=document.getElementById(inputId);
  if(next){
    next.focus({preventScroll:true});
    if(start!==null && end!==null){
      const pos=Math.min(start,next.value.length);
      next.setSelectionRange(pos,Math.min(end,next.value.length));
    }
  }
}

function w02OpenDraftBatch(batchId,focus=''){
  w02CaptureScroll();
  switchD01Batch(batchId);
  openD01(focus,'review-draft');
}

function w02OpenVerificationItem(batchId,focus='human_verification'){
  w02CaptureScroll();
  switchD01Batch(batchId);
  openD01(focus||'human_verification','review-verification');
}

function bindW02DraftControls(){
  const map=[
    ['w02FilterMaterial','material'],
    ['w02FilterScene','scene'],
    ['w02FilterEvidence','evidence'],
    ['w02FilterReview','review']
  ];
  map.forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(el) el.onchange=()=>{w02DraftFilters[key]=el.value;w02Page=1;renderW02Draft();};
  });

  const search=document.getElementById('w02Search');
  if(search) search.oninput=()=>{
    w02DraftFilters.search=search.value;
    w02Page=1;
    w02RerenderPreserveInput(renderW02Draft,'w02Search');
  };

  document.querySelectorAll('[data-summary]').forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.summary;
      if(key==='all'){
        w02DraftFilters.summary='all';
      }else{
        w02DraftFilters.summary=w02DraftFilters.summary===key?'all':key;
      }
      w02Page=1;
      renderW02Draft();
    };
  });

  document.querySelectorAll('[data-open-batch]').forEach(btn=>{
    btn.onclick=()=>w02OpenDraftBatch(btn.dataset.openBatch,'');
  });
  document.querySelectorAll('[data-verify-batch]').forEach(btn=>{
    btn.onclick=()=>w02OpenDraftBatch(btn.dataset.verifyBatch,'human_verification');
  });
  document.querySelectorAll('[data-360-batch]').forEach(btn=>{
    btn.onclick=()=>toast('360 Evidence Viewer：下一层沉浸查看层待接入');
  });
  document.querySelectorAll('[data-attention-batch]').forEach(btn=>{
    const row=W02_BATCHES.find(r=>r.batch_id===btn.dataset.attentionBatch);
    const focus=row?.unresolved_verification_count>0?'human_verification':'local_opportunity';
    btn.onclick=()=>w02OpenDraftBatch(btn.dataset.attentionBatch,focus);
  });
  document.querySelectorAll('[data-page]').forEach(btn=>{
    btn.onclick=()=>{w02Page=Number(btn.dataset.page);renderW02Draft();};
  });
  const clear=document.getElementById('w02ClearFilters');
  if(clear) clear.onclick=()=>{
    w02DraftFilters={material:'all',scene:'all',evidence:'all',review:'all',search:'',summary:'all'};
    w02Page=1;
    renderW02Draft();
  };
}

function bindW02VerificationControls(){
  const map=[
    ['w02VMaterial','material'],
    ['w02VScene','scene'],
    ['w02VType','type'],
    ['w02VStatus','status']
  ];
  map.forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(el) el.onchange=()=>{
      w02VerificationFilters[key]=el.value;
      renderW02Verification();
    };
  });

  const search=document.getElementById('w02VSearch');
  if(search) search.oninput=()=>{
    w02VerificationFilters.search=search.value;
    w02RerenderPreserveInput(renderW02Verification,'w02VSearch');
  };

  document.querySelectorAll('[data-v-material-toggle]').forEach(btn=>{
    btn.onclick=()=>{
      const material=btn.dataset.vMaterialToggle;
      w02VerificationExpandedMaterial=w02VerificationExpandedMaterial===material?'__collapsed__':material;
      renderW02Verification();
    };
  });

  document.querySelectorAll('[data-v-open-batch]').forEach(btn=>{
    btn.onclick=()=>w02OpenVerificationItem(btn.dataset.vOpenBatch,'');
  });

  document.querySelectorAll('[data-v-item]').forEach(btn=>{
    btn.onclick=()=>w02OpenVerificationItem(btn.dataset.vBatch,btn.dataset.vFocus||'human_verification');
  });

  document.querySelectorAll('[data-attention-batch]').forEach(btn=>{
    const batchId=btn.dataset.attentionBatch;
    const exact=W02_VERIFICATION_ITEMS.find(item=>
      item.batch_id===batchId && ['unverified','unable_to_verify'].includes(item.status)
    );
    btn.onclick=()=>w02OpenVerificationItem(batchId,exact?.focus||'human_verification');
  });

  const clear=document.getElementById('w02VClearFilters');
  if(clear) clear.onclick=()=>{
    w02VerificationFilters={material:'all',scene:'all',type:'all',status:'active',search:''};
    w02VerificationExpandedMaterial=null;
    renderW02Verification();
  };
}

function bindW02(){
  document.getElementById('w02NavView').onclick=()=>{show('w01');renderW01Scene();applyW01Zoom();};
  document.getElementById('w02TabDraft').onclick=()=>{
    w02CaptureScroll();
    w02Tab='draft';
    renderW02();
    setTimeout(()=>window.scrollTo({top:w02ScrollState.draft||0,behavior:'auto'}),0);
  };
  document.getElementById('w02TabVerification').onclick=()=>{
    w02CaptureScroll();
    w02Tab='verification';
    renderW02();
    setTimeout(()=>window.scrollTo({top:w02ScrollState.verification||0,behavior:'auto'}),0);
  };

  const ctx=document.getElementById('w02Context');
  const ctxBtn=document.getElementById('w02ContextBtn');
  ctxBtn.onclick=e=>{
    e.stopPropagation();
    const open=!ctx.classList.contains('open');
    ctx.classList.toggle('open',open);
    ctxBtn.setAttribute('aria-expanded',String(open));
  };
  document.getElementById('w02NewProject').onclick=()=>{ctx.classList.remove('open');show('c01');};
  document.addEventListener('click',()=>{
    if(ctx.classList.contains('open')){
      ctx.classList.remove('open');
      ctxBtn.setAttribute('aria-expanded','false');
    }
  });
  renderW02();
}
